  --bs: min(28vh, 42vw);
  --hs: min(36vh, 56vw);
  --D: 200px;
  --u: min(1vh, 0.9vw);
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-ui);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
#stage {
  position: fixed; inset: 0;
  background: var(--sky);
  overflow: hidden;
  color: var(--cream);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#scroll { position: absolute; top: 0; bottom: 0; left: 0; width: var(--ww, 100%); background: var(--sky) var(--bg-url) center bottom / cover no-repeat; will-change: transform; }
#scroll .drift { position: absolute; top: 0; bottom: 0; left: 0; width: 200%; animation: driftc 28s linear infinite; }
#scroll.glide { transition: transform 2.6s ease-in-out; }
#scroll.stop .drift { animation-play-state: paused; }
@keyframes driftc { from { transform: translateX(0); } to { transform: translateX(-50%); } }
button { font-family: inherit; }
button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }

/* clouds live inside the scrolling panels and are masked by the sky, so they only show on the blue and slip behind the trees */
.sky { position: absolute; inset: 0; -webkit-mask: var(--mask-url) center bottom / cover no-repeat; mask: var(--mask-url) center bottom / cover no-repeat; }
.cloud { position: absolute; width: calc(15 * var(--u) * var(--k, 1)); height: calc(4.25 * var(--u) * var(--k, 1)); background: #fff; border-radius: 40px; opacity: .88; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: calc(6.5 * var(--u) * var(--k, 1)); height: calc(6.5 * var(--u) * var(--k, 1)); left: calc(2.25 * var(--u) * var(--k, 1)); top: calc(-3.25 * var(--u) * var(--k, 1)); }
.cloud::after { width: calc(4.75 * var(--u) * var(--k, 1)); height: calc(4.75 * var(--u) * var(--k, 1)); left: calc(7.75 * var(--u) * var(--k, 1)); top: calc(-2.25 * var(--u) * var(--k, 1)); }

/* leaves streaming past: a quick foreground layer that sells the speed of the flight */
#leaves { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
#leaves.stop i { animation-play-state: paused; }
#leaves i { position: absolute; left: 0; top: var(--y); width: var(--s); height: calc(var(--s) * .5); border-radius: 100% 0 100% 0; background: var(--c); opacity: .75; animation: leaf var(--t) linear infinite; animation-delay: var(--d); will-change: transform; }
@keyframes leaf { from { transform: translate3d(105vw, 0, 0) rotate(0deg); } 50% { transform: translate3d(50vw, calc(var(--w) * 1px), 0) rotate(180deg); } to { transform: translate3d(-12vw, 0, 0) rotate(360deg); } }

/* banner */
#banner {
  position: absolute; z-index: 20; top: 0; left: 0; right: 0;
  background: rgba(46, 16, 10, .8);
  border-bottom: 3px solid var(--gold-deep);
  border-radius: 0 0 24px 24px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: transform .6s ease;
}
#banner.away { transform: translateY(-130%); }
.status { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 26px; }
.counter { font-weight: 800; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 52px; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 242, 210, .25); transition: background .3s; }
.dot.on { background: var(--gold); }
.dot.now { outline: 2px solid var(--cream); outline-offset: 1px; }
.hearts { display: flex; align-items: center; gap: 5px; font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; min-width: 52px; justify-content: flex-end; }
.hearts svg { width: 22px; height: 22px; fill: #ff5a4d; }
.hearts.hurt { animation: shake .4s; color: #ff9a8f; }
#word { font-weight: 900; font-size: clamp(30px, min(7.2vh, 8.4vw), 60px); line-height: 1.1; color: var(--cream); white-space: nowrap; text-align: center; }
#word.pop { animation: pop .45s ease-out; }
#word .end { color: var(--gold); text-decoration: underline; text-decoration-thickness: .06em; text-underline-offset: .1em; }
#word .ending { color: var(--gold); }
#word .arrow { color: #f3cfa5; font-weight: 700; margin: 0 .15em; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { translate: 0 0; } 20% { translate: -8px 0; } 40% { translate: 8px 0; } 60% { translate: -6px 0; } 80% { translate: 6px 0; } }

/* bottom controls */
.ctl { position: absolute; z-index: 20; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; }
.ctl.l { left: max(14px, env(safe-area-inset-left, 0px)); }
.ctl.r { right: max(14px, env(safe-area-inset-right, 0px)); }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--gold); background: rgba(46, 16, 10, .86); color: var(--cream); font-weight: 900; font-size: 22px; cursor: pointer; display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 24px; height: 24px; fill: currentColor; }
.icon-btn[aria-pressed="true"] { color: rgba(255, 242, 210, .45); }

/* play field and tokens */
#field { position: absolute; inset: 0; z-index: 5; touch-action: none; overflow: hidden; cursor: ns-resize; }
.token { position: absolute; left: 0; top: 0; width: var(--D); height: var(--D); will-change: transform; pointer-events: none; }
.tpop { position: absolute; inset: 0; animation: popin .5s cubic-bezier(.3, 1.4, .5, 1) both; animation-delay: var(--d, 0s); }
.tin { position: absolute; inset: 0; }
.tin img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; animation: spin 48s linear infinite; filter: drop-shadow(0 1vh 1.2vh rgba(20, 40, 10, .35)); }
.tin span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: calc(var(--D) * .3); color: var(--cream); text-shadow: 0 .04em 0 #1f0905; }
.tin::after { content: ""; position: absolute; inset: 9%; border-radius: 50%; background: transparent; transition: background .2s; }
.tin.good::after { background: rgba(120, 200, 50, .7); }
.tin.bad::after { background: rgba(226, 57, 43, .7); }
.tin.good { animation: good .7s ease-out forwards; }
.tin.bad { animation: bad .55s forwards; }
.tin.fade { transition: opacity .4s, transform .4s; opacity: 0; transform: scale(.7); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes popin { 0% { transform: scale(0) rotate(-40deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes good { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1.1); opacity: 0; } }
@keyframes bad { 0% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); opacity: 1; } 100% { transform: scale(.6); opacity: 0; } }

/* countdown */
#count { position: absolute; z-index: 15; left: 50%; top: 52%; transform: translate(-50%, -50%); font-weight: 900; font-size: min(26vh, 34vw); line-height: 1; color: var(--cream); -webkit-text-stroke: .05em var(--board); paint-order: stroke fill; text-shadow: 0 .05em .12em rgba(0, 0, 0, .35); pointer-events: none; }
#count.tick { animation: tick .75s ease-out; }
@keyframes tick { 0% { transform: translate(-50%, -50%) scale(1.7); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(.9); opacity: .95; } }

/* Baba Yaga */
#baba { position: absolute; z-index: 6; width: var(--bs); height: var(--bs); left: 0; top: 0; pointer-events: none; }
#baba.landing { transition: left 2.4s cubic-bezier(.2, .6, .3, 1), top 2.4s cubic-bezier(.55, .05, .9, .6); }
#baba.entering { transition: left 1.1s ease-in-out, top 1.1s ease-in-out; }
#baba .bob { width: 100%; height: 100%; animation: bob 2.6s ease-in-out infinite; }
#baba .bob.still { animation: none; }
#baba img { width: 100%; height: 100%; display: block; object-fit: contain; transform-origin: 50% 85%; transition: transform 1.1s ease, opacity 1.1s ease; }
#baba img.land { animation: squash .45s ease-out; }
#baba img.gone { transform: scale(.22); opacity: 0; }
#baba.hurt .bob { animation: blink .7s, bob 2.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-1.2vh) rotate(2deg); } }
@keyframes squash { 0% { transform: scale(1.06, .9); } 60% { transform: scale(.97, 1.04); } 100% { transform: scale(1); } }
@keyframes blink { 0%, 40%, 80% { opacity: .25; } 20%, 60%, 100% { opacity: 1; } }

/* hut */
#hut { visibility: hidden; position: absolute; z-index: 4; bottom: 1.5vh; width: var(--hs); height: var(--hs); left: calc(-1 * var(--hs) - 12vw); transition: left 3.2s cubic-bezier(.3, .6, .4, 1); }
#hut.show { visibility: visible; }
#hut img { width: 100%; height: 100%; display: block; transform-origin: 50% 100%; pointer-events: none; }
#hut.walking img { animation: stomp .55s ease-in-out infinite; }
@keyframes stomp { 0%, 100% { transform: translateY(0) rotate(-2.5deg); } 50% { transform: translateY(-2.2vh) rotate(2.5deg); } }

.spark { position: absolute; z-index: 8; color: var(--gold); font-size: 24px; pointer-events: none; text-shadow: 0 0 6px #fff; animation: spark .9s ease-out forwards; }
@keyframes spark { from { transform: translate(-50%, -50%) scale(.4); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(120deg); opacity: 0; } }

/* speech bubble */
#bubble { position: absolute; z-index: 30; background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 18px; padding: 10px 18px; font-weight: 900; font-size: clamp(18px, 3vh, 28px); text-align: center; white-space: nowrap; opacity: 0; transform: translate(-50%, 8px) scale(.9); transition: opacity .3s, transform .3s; pointer-events: none; }
#bubble::after { content: ""; position: absolute; left: 50%; bottom: -13px; width: 18px; height: 18px; background: #fff; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
#bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

/* overlays */
.overlay { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(30, 10, 4, .6); }
.card { width: min(520px, 100%); max-height: 100%; overflow: auto; background: var(--cream); color: var(--ink); border: 4px solid var(--gold-deep); border-radius: 26px; padding: 22px 22px 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, .4); }
.card h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 6.4vw, 42px); line-height: 1.1; margin: 0 0 10px; text-wrap: balance; text-align: center; }
.card p { margin: 0 0 12px; font-size: 18px; line-height: 1.4; font-weight: 800; text-align: center; }
.rules { margin: 6px 0 16px; }
.rule { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; padding: 10px 0; border-top: 2px dashed #d3a866; }
.pill { background: var(--ink); color: var(--gold); font-weight: 900; font-size: 24px; border-radius: 14px; padding: 8px 0; text-align: center; }
.rule div:last-child { font-size: 18px; line-height: 1.4; font-weight: 800; min-width: 0; }
.rule em { font-style: normal; font-weight: 900; color: #a2480b; }
.big-btn { width: 100%; min-height: 56px; border-radius: 18px; border: 3px solid #2f5a10; background: linear-gradient(#c4ee86, #7bb83a); color: var(--ink); font-weight: 900; font-size: 24px; cursor: pointer; box-shadow: 0 5px 0 #2f5a10; }
.big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2f5a10; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0 16px; }
.stat { background: #fff; border: 2px solid #e3bd7c; border-radius: 16px; padding: 10px 6px; text-align: center; min-width: 0; }
.stat b { display: block; font-size: 32px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; font-weight: 800; color: #7a3a10; }

@media (max-height: 460px) { .card { padding: 14px 16px; } .rule { padding: 6px 0; } .card p { margin-bottom: 6px; } }
@media (prefers-reduced-motion: reduce) {
  #scroll .drift, #leaves i, #baba .bob, #hut.walking img, .spark, .tin img { animation: none; }
}

<script>
(function () {
  'use strict';
  var WORDS = [
    { w: 'cat', a: 's' }, { w: 'dog', a: 's' }, { w: 'book', a: 's' }, { w: 'apple', a: 's' }, { w: 'boy', a: 's' },
    { w: 'bus', a: 'es' }, { w: 'box', a: 'es' }, { w: 'dish', a: 'es' }, { w: 'watch', a: 'es' }, { w: 'class', a: 'es' },
    { w: 'baby', a: 'ies' }, { w: 'city', a: 'ies' }, { w: 'party', a: 'ies' }, { w: 'lady', a: 'ies' }, { w: 'story', a: 'ies' }
  ];
  var TOTAL = WORDS.length, LIVES = 9;
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), field = $('field'), baba = $('baba'), bob = $('bob'), babaImg = $('babaImg'), hut = $('hut');
  var banner = $('banner'), wordEl = $('word');
  var modal = $('modal'), endBox = $('end'), bubble = $('bubble');
  var counter = $('counter'), dotsEl = $('dots'), heartsEl = $('hearts'), heartN = $('heartN');
  var tokSrc = $('tokSrc').src;

  var order = [], idx = 0, done = 0, firstTry = 0, mistakes = 0, tries = 0, lives = LIVES;
  var state = 'idle';            // idle | play | between | finale | over
  var paused = true, gen = 0, started = false, modalMode = 'intro';
  var W = 0, H = 0, D = 200, bs = 100, playTop = 100, playBot = 500, vT = 150, respawnAt = 0;
  var bx = 0, by = 300, targetY = 300;
  var keys = { up: false, down: false };
  var tokens = [], pending = [], tNow = 0, lastT = 0;
  var CD = 0.75, cdLeft = 0, cdShown = 0;
  var countEl = $('count');

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* ---------- sound ---------- */
  var ac = null, muted = false;
  function initAudio() {
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
  }
  function tone(f, t0, d, type, v) {
    if (muted || !ac) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v || 0.15, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.05);
    } catch (e) {}
  }
  var sfx = {
    ok: function () { tone(660, 0, .15); tone(880, .1, .25); },
    bad: function () { tone(190, 0, .28, 'sawtooth', .07); },
    win: function () { [523, 659, 784, 1047, 784, 1047].forEach(function (f, i) { tone(f, i * .14, .3); }); }
  };
  $('soundBtn').addEventListener('click', function () {
    muted = !muted; this.setAttribute('aria-pressed', String(muted));
  });

  function showCount(n) {
    countEl.textContent = String(n); countEl.hidden = false;
    countEl.classList.remove('tick'); void countEl.offsetWidth; countEl.classList.add('tick');
    tone(n === 1 ? 700 : 520, 0, .18, 'sine', .12);
  }
  function hideCount() { countEl.hidden = true; }

  var CLOUDS = [[3, 15, 1.0], [14, 26, 0.7], [25, 12, 1.2], [37, 22, 0.9], [48, 14, 1.1], [60, 27, 0.8], [71, 16, 1.0], [84, 24, 0.75]];
  (function buildScroll() {
    var sky = document.createElement('div'); sky.className = 'sky';
    var dr = document.createElement('div'); dr.className = 'drift';
    for (var r = 0; r < 2; r++) CLOUDS.forEach(function (c) {
      var d = document.createElement('div'); d.className = 'cloud';
      d.style.left = (c[0] / 2 + r * 50) + '%'; d.style.top = c[1] + '%'; d.style.setProperty('--k', c[2]);
      dr.appendChild(d);
    });
    sky.appendChild(dr); $('scroll').appendChild(sky);
  })();
  var WW = 0;
  (function buildLeaves() {
    var lv = $('leaves'), cols = ['#d6c24a', '#8fb339', '#c98a2b', '#6e9a3a', '#e8d36a'];
    for (var i = 0; i < 22; i++) {
      var e = document.createElement('i');
      e.style.setProperty('--y', (12 + Math.random() * 80) + '%');
      e.style.setProperty('--s', (10 + Math.random() * 14) + 'px');
      e.style.setProperty('--c', cols[i % cols.length]);
      e.style.setProperty('--t', (1.7 + Math.random() * 2.2) + 's');
      e.style.setProperty('--d', (-Math.random() * 5) + 's');
      e.style.setProperty('--w', (Math.random() * 60 - 30));
      lv.appendChild(e);
    }
  })();
  var panX = 0;
  function panWorld() {
    var mx = Math.max(0, WW - W); panX = Math.min(panX, mx);
    $('scroll').style.transform = 'translateX(' + (-panX) + 'px)';
  }
  function glideEnd() {
    var sc = $('scroll'); sc.classList.add('glide'); panX = Math.max(0, WW - W);
    sc.style.transform = 'translateX(' + (-panX) + 'px)';
  }

  /* ---------- helpers ---------- */
  function pluralHTML(it) {
    if (it.a === 'ies') return it.w.slice(0, -1) + '<span class="ending">ies</span>';
    return it.w + '<span class="ending">' + it.a + '</span>';
  }
  function buildDots() {
    dotsEl.innerHTML = '';
    for (var i = 0; i < TOTAL; i++) { var d = document.createElement('span'); d.className = 'dot'; dotsEl.appendChild(d); }
  }
  function updateHeader() {
    var ds = dotsEl.children;
    for (var i = 0; i < ds.length; i++) {
      ds[i].classList.toggle('on', i < done);
      ds[i].classList.toggle('now', i === idx && done < TOTAL);
    }
    counter.textContent = Math.min(idx + 1, TOTAL) + '/' + TOTAL;
    heartN.textContent = String(lives);
  }
  function sparkle(cx, cy) {
    for (var i = 0; i < 12; i++) {
      var s = document.createElement('span');
      s.className = 'spark'; s.textContent = '★';
      var ang = Math.random() * Math.PI * 2, dist = D * (0.5 + Math.random() * 0.4);
      s.style.left = cx + 'px'; s.style.top = cy + 'px';
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      stage.appendChild(s);
      (function (el) { setTimeout(function () { el.remove(); }, 1000); })(s);
    }
  }

  /* ---------- layout ---------- */
  function layout() {
    W = stage.clientWidth; H = stage.clientHeight;
    D = Math.min(H * 0.24, W * 0.3);
    stage.style.setProperty('--D', D + 'px');
    WW = Math.max(W * 1.08, H * 1.79); stage.style.setProperty('--ww', WW + 'px'); panWorld();
    bs = baba.offsetWidth;
    playTop = banner.getBoundingClientRect().bottom + 6;
    playBot = H - 6;
    vT = clamp(W / 3.6, 190, 400);
    bx = clamp(W * 0.2, bs * 0.55, W * 0.4);
    clampY(); placeBaba();
  }
  function clampY() {
    var minY = playTop + bs * 0.4, maxY = playBot - bs * 0.4;
    by = clamp(by, minY, maxY); targetY = clamp(targetY, minY, maxY);
  }
  function placeBaba() {
    if (state === 'finale') return;
    baba.style.left = (bx - bs / 2) + 'px';
    baba.style.top = (by - bs / 2) + 'px';
  }
  window.addEventListener('resize', layout);

  /* ---------- tokens ---------- */
  function clearTokens() { tokens.forEach(function (t) { t.el.remove(); }); tokens = []; pending = []; }

  function makeToken(end, x, y, delay) {
    var el = document.createElement('div'); el.className = 'token';
    var pop = document.createElement('div'); pop.className = 'tpop'; pop.style.setProperty('--d', delay + 's');
    var tin = document.createElement('div'); tin.className = 'tin';
    var img = document.createElement('img'); img.alt = ''; img.src = tokSrc;
    var sp = document.createElement('span'); sp.textContent = '-' + end;
    tin.appendChild(img); tin.appendChild(sp); pop.appendChild(tin); el.appendChild(pop); field.appendChild(el);
    el.style.transform = 'translate3d(' + (x - D / 2) + 'px,' + (y - D / 2) + 'px,0)';
    tokens.push({ el: el, tin: tin, end: end, x: x, y: y, ph: Math.random() * 6, dead: false, ready: tNow + 0.4 + delay });
  }

  // A wave of three boards pops up ahead of Baba Yaga, each at its own height, one after another.
  // The distance between them is measured from the hit radius and the flight speed, so there is always
  // room to fly past one board and line up with the next without touching it.
  function spawnTokens() {
    var ends = shuffle(['s', 'es', 'ies']);
    var lanes = shuffle([0, 1, 2]);
    var hitR = bs * 0.3 + D * 0.4;
    var xB = W - D * 0.5 - 8;
    var x0 = Math.min(xB, Math.max(W * 0.5, bx + bs * 0.5 + D * 1.2));
    var gap = 2 * hitR + vT * 0.4;
    var bandH = (playBot - playTop) / 3;
    pending = [];
    for (var k = 0; k < 3; k++) {
      var xk = x0 + gap * k;
      var y = playTop + bandH * (lanes[k] + 0.5) + (Math.random() - 0.5) * bandH * 0.2;
      y = clamp(y, playTop + D / 2 + 2, playBot - D / 2 - 2);
      if (xk <= xB) makeToken(ends[k], xk, y, k * 0.12);
      else pending.push({ end: ends[k], y: y, at: tNow + (xk - xB) / vT });
    }
  }

  /* ---------- game flow ---------- */
  function showWord() {
    var it = order[idx];
    tries = 0; respawnAt = 0;
    wordEl.className = ''; wordEl.textContent = it.w;
    void wordEl.offsetWidth; wordEl.className = 'pop';
    clearTokens(); layout();
    state = 'count'; cdLeft = 3 * CD; cdShown = 0;
    updateHeader();
    requestAnimationFrame(layout);
  }

  function hit(tk) {
    var it = order[idx];
    tk.dead = true;
    if (tk.end === it.a) onCorrect(it, tk); else onWrong(it, tk);
  }

  function onCorrect(it, tk) {
    state = 'between'; pending = [];
    if (tries === 0) firstTry++;
    tk.tin.classList.add('good');
    tokens.forEach(function (t) { if (t !== tk) t.tin.classList.add('fade'); });
    wordEl.className = '';
    wordEl.innerHTML = it.w + '<span class="arrow">\u2192</span>' + pluralHTML(it);
    void wordEl.offsetWidth; wordEl.className = 'pop';
    done++;
    updateHeader(); sfx.ok();
    sparkle(tk.x, tk.y);
    var g = gen;
    setTimeout(function () { if (g === gen) clearTokens(); }, 700);
    setTimeout(function () {
      if (g !== gen) return;
      if (done >= TOTAL) finale(); else { idx++; showWord(); }
    }, 1100);
  }

  function onWrong(it, tk) {
    tries++; mistakes++; lives--;
    tk.tin.classList.add('bad');
    (function (t) { setTimeout(function () { t.el.remove(); }, 600); })(tk);
    sfx.bad();
    baba.classList.remove('hurt'); void baba.offsetWidth; baba.classList.add('hurt');
    heartsEl.classList.remove('hurt'); void heartsEl.offsetWidth; heartsEl.classList.add('hurt');
    wordEl.innerHTML = it.w.slice(0, -2) + '<span class="end">' + it.w.slice(-2) + '</span>';
    updateHeader();
    if (lives <= 0) gameOver();
  }

  function gameOver() {
    state = 'over'; gen++; hideCount();
    $('scroll').classList.add('stop'); $('leaves').classList.add('stop');
    clearTokens();
    showEnd(false);
  }

  /* ---------- main loop ---------- */
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (ts - lastT) / 1000 || 0); lastT = ts;
    if (paused || state === 'idle' || state === 'finale' || state === 'over') return;
    if (panX < WW - W) { panX = Math.min(WW - W, panX + (WW - W) / 60 * dt); $('scroll').style.transform = 'translateX(' + (-panX) + 'px)'; }
    tNow += dt;

    // steer height
    targetY += ((keys.down ? 1 : 0) - (keys.up ? 1 : 0)) * 900 * dt;
    clampY();
    var py = by;
    by += (targetY - by) * Math.min(1, dt * 12);
    var vy = by - py;
    baba.style.rotate = clamp(vy * 1.6, -14, 14) + 'deg';

    placeBaba();

    // 3-2-1 before the boards of a new word appear
    if (state === 'count') {
      cdLeft -= dt;
      var n = Math.max(1, Math.ceil(cdLeft / CD));
      if (n !== cdShown) { cdShown = n; showCount(n); }
      if (cdLeft <= 0) { hideCount(); tone(880, 0, .25, 'sine', .14); spawnTokens(); state = 'play'; }
    }

    // the world scrolls: boards drift toward Baba Yaga, who is always in flight
    for (var q = pending.length - 1; q >= 0; q--) {
      if (state === 'play' && tNow >= pending[q].at) { var pd = pending.splice(q, 1)[0]; makeToken(pd.end, W - D * 0.5 - 8, pd.y, 0); }
    }
    var alive = 0, r1 = bs * 0.3;
    for (var i = tokens.length - 1; i >= 0; i--) {
      var t = tokens[i];
      t.x -= vT * dt;
      if (t.x < -D) { t.el.remove(); tokens.splice(i, 1); continue; }
      var yy = t.y + Math.sin(tNow * 2 + t.ph) * 6;
      t.el.style.transform = 'translate3d(' + (t.x - D / 2) + 'px,' + (yy - D / 2) + 'px,0)';
      if (state === 'play' && !t.dead) {
        if (t.x > bx - D * 0.6) alive++;
        if (tNow >= t.ready) {
          var dx = t.x - bx, dy = yy - by, rr = r1 + D * 0.4;
          if (dx * dx + dy * dy < rr * rr) { hit(t); if (state !== 'play') break; }
        }
      }
    }
    // nothing left to catch (missed, or wrong ones hit): a fresh wave of the same word, laid out differently
    alive += pending.length;
    if (state === 'play') {
      if (alive === 0) {
        if (!respawnAt) respawnAt = tNow + 0.5;
        else if (tNow >= respawnAt) { respawnAt = 0; clearTokens(); spawnTokens(); }
      } else respawnAt = 0;
    }
  }

  /* ---------- input ---------- */
  function pointer(e) {
    if (paused || (state !== 'play' && state !== 'between' && state !== 'count')) return;
    targetY = e.clientY - (e.pointerType === 'touch' ? bs * 0.3 : 0);
  }
  field.addEventListener('pointermove', pointer);
  field.addEventListener('pointerdown', pointer);
  var KEYMAP = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
  document.addEventListener('keydown', function (e) {
    var k = KEYMAP[e.key];
    if (k) { keys[k] = true; if (e.key.indexOf('Arrow') === 0) e.preventDefault(); }
  });
  document.addEventListener('keyup', function (e) {
    var k = KEYMAP[e.key];
    if (k) keys[k] = false;
  });

  /* ---------- finale ---------- */
  async function finale() {
    var g = gen;
    state = 'finale'; hideCount();
    $('scroll').classList.add('stop'); $('leaves').classList.add('stop');
    clearTokens(); banner.classList.add('away');
    $('pauseBtn').hidden = true; $('rulesBtn').hidden = true;
    baba.style.rotate = '0deg';
    baba.style.left = (bx - bs / 2) + 'px'; baba.style.top = (by - bs / 2) + 'px';
    await sleep(400); if (g !== gen) return;

    var hs = hut.offsetWidth;
    var doorShift = hs * 0.78;
    var start = Math.max(8, (W - (doorShift + bs)) / 2);

    glideEnd();
    hut.classList.add('show', 'walking');
    hut.style.left = start + 'px';
    baba.classList.add('landing');
    baba.style.left = (start + doorShift) + 'px';
    baba.style.top = (H - bs - H * 0.035) + 'px';

    await sleep(2500); if (g !== gen) return;
    bob.classList.add('still'); babaImg.classList.add('land');
    await sleep(800); if (g !== gen) return;
    hut.classList.remove('walking');

    var br = baba.getBoundingClientRect();
    bubble.style.left = (br.left + br.width / 2) + 'px';
    bubble.style.bottom = (H - br.top - bs * 0.12) + 'px';
    bubble.classList.add('show'); sfx.win();
    await sleep(2400); if (g !== gen) return;
    bubble.classList.remove('show');
    await sleep(300); if (g !== gen) return;

    var hr = hut.getBoundingClientRect();
    baba.classList.remove('landing'); baba.classList.add('entering');
    bob.classList.remove('still'); babaImg.classList.remove('land');
    baba.style.left = (hr.left + hr.width * 0.72 - bs / 2) + 'px';
    baba.style.top = (hr.top + hr.height * 0.55 - bs / 2) + 'px';
    babaImg.classList.add('gone');
    await sleep(1400); if (g !== gen) return;

    hut.classList.add('walking');
    hut.style.transition = 'left 3.6s cubic-bezier(.5,0,.9,.6)';
    hut.style.left = (W + hs * 0.2) + 'px';
    await sleep(3000); if (g !== gen) return;
    showEnd(true);
  }

  function showEnd(win) {
    $('stDone').textContent = String(done);
    $('stFirst').textContent = String(firstTry);
    $('stMist').textContent = String(mistakes);
    $('endTitle').textContent = win ? 'Well done!' : 'Try again!';
    $('again').textContent = win ? 'Play again' : 'Try again';
    endBox.hidden = false;
    $('again').focus({ preventScroll: true });
  }

  /* ---------- start / reset ---------- */
  function resetScene() {
    baba.style.transition = 'none'; hut.style.transition = 'none';
    baba.className = ''; baba.removeAttribute('style');
    hut.className = ''; hut.removeAttribute('style');
    bob.className = 'bob'; babaImg.className = '';
    banner.classList.remove('away'); bubble.classList.remove('show'); $('scroll').classList.remove('stop'); $('leaves').classList.remove('stop');
    $('pauseBtn').hidden = false; $('rulesBtn').hidden = false; hideCount();
    clearTokens();
    void baba.offsetWidth; void hut.offsetWidth;
    baba.style.transition = ''; hut.style.transition = '';
  }

  function startGame() {
    gen++;
    resetScene();
    order = shuffle(WORDS.slice());
    idx = 0; done = 0; firstTry = 0; mistakes = 0; lives = LIVES; panX = 0; $('scroll').classList.remove('glide'); panWorld();
    endBox.hidden = true;
    started = true; paused = false; state = 'idle';
    layout();
    by = targetY = (playTop + playBot) / 2; placeBaba();
    showWord();
  }

  function openModal(mode) {
    modalMode = mode; paused = true;
    var intro = mode === 'intro', pause = mode === 'pause';
    $('modalTitle').textContent = intro ? 'Help Baba Yaga get home' : pause ? 'Pause' : 'Rules';
    $('modalLead').hidden = !intro;
    $('rules').hidden = pause;
    $('modalBtn').textContent = intro ? 'Play' : pause ? 'Continue' : 'OK';
    modal.hidden = false; $('scroll').classList.add('stop'); $('leaves').classList.add('stop');
    $('modalBtn').focus({ preventScroll: true });
  }
  $('pauseBtn').addEventListener('click', function () { if (started && state !== 'finale') openModal('pause'); });
  $('rulesBtn').addEventListener('click', function () { if (started && state !== 'finale') openModal('help'); });
  $('modalBtn').addEventListener('click', function () {
    initAudio();
    modal.hidden = true; $('scroll').classList.remove('stop'); $('leaves').classList.remove('stop');
    if (modalMode === 'intro' && !started) startGame(); else paused = false;
  });
  $('again').addEventListener('click', function () { initAudio(); startGame(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && started && !paused && state === 'play') openModal('pause'); });

  buildDots();
  wordEl.textContent = 'cat';
  heartN.textContent = String(LIVES);
  layout();
  by = targetY = (playTop + playBot) / 2; placeBaba();
  openModal('intro');
  requestAnimationFrame(frame);
})();
</script>
